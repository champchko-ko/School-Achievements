<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#46178f"/>
      <stop offset="50%" style="stop-color:#380e6e"/>
      <stop offset="100%" style="stop-color:#2a0a54"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffb800"/>
      <stop offset="100%" style="stop-color:#ff8c00"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Dotted pattern overlay -->
  <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.5" fill="white" opacity="0.15"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  
  <!-- Trophy icon -->
  <g transform="translate(520, 80)">
    <path d="M80 0 L100 40 L160 40 L120 70 L135 110 L80 85 L25 110 L40 70 L0 40 L60 40 Z" fill="url(#gold)" opacity="0.9"/>
    <rect x="55" y="110" width="50" height="15" rx="3" fill="#ffb800"/>
    <rect x="40" y="125" width="80" height="10" rx="5" fill="#ffb800" opacity="0.7"/>
  </g>
  
  <!-- Stars -->
  <text x="200" y="180" font-size="40" fill="#ffb800" opacity="0.4">★</text>
  <text x="950" y="150" font-size="30" fill="#ffb800" opacity="0.3">★</text>
  <text x="1050" y="250" font-size="25" fill="#ffb800" opacity="0.25">★</text>
  <text x="120" y="280" font-size="20" fill="#ffb800" opacity="0.2">★</text>
  
  <!-- Title -->
  <text x="600" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="72" fill="white">
    إنجازات المدرسة
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="32" fill="#c4a8ff">
    School Achievements
  </text>
  
  <!-- Divider line -->
  <rect x="400" y="350" width="400" height="3" rx="1.5" fill="url(#gold)" opacity="0.6"/>
  
  <!-- Description -->
  <text x="600" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-weight="500" font-size="24" fill="#a78bfa">
    منصة عرض إنجازات الطلاب والأنشطة المدرسية
  </text>
  
  <!-- Feature badges -->
  <g transform="translate(200, 440)">
    <rect x="0" y="0" width="160" height="45" rx="22" fill="white" opacity="0.1"/>
    <text x="80" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#c4a8ff">🏆 تقييمات</text>
  </g>
  <g transform="translate(420, 440)">
    <rect x="0" y="0" width="160" height="45" rx="22" fill="white" opacity="0.1"/>
    <text x="80" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#c4a8ff">📸 إنجازات</text>
  </g>
  <g transform="translate(640, 440)">
    <rect x="0" y="0" width="160" height="45" rx="22" fill="white" opacity="0.1"/>
    <text x="80" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#c4a8ff">📊 تقارير</text>
  </g>
  <g transform="translate(860, 440)">
    <rect x="0" y="0" width="160" height="45" rx="22" fill="white" opacity="0.1"/>
    <text x="80" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#c4a8ff">🎯 متابعة</text>
  </g>
  
  <!-- URL -->
  <text x="600" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-weight="500" font-size="18" fill="#7c5cbf">
    school-achievements-six.vercel.app
  </text>
  
  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#gold)" opacity="0.8"/>
</svg>
