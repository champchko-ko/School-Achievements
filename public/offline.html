<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>School Achievements — Offline</title>
  <style>
    body{margin:0;min-height:100dvh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#380e6e;color:#fff;padding:24px}
    main{text-align:center;max-width:26rem}
    .icon{width:88px;height:88px;border-radius:24px;margin-inline:auto;box-shadow:0 18px 40px #0007}
    h1{font-size:1.35rem;margin:20px 0 8px}
    p{color:#d9cdfa;line-height:1.7;margin:0}
    button{margin-top:22px;border:0;border-radius:999px;padding:12px 26px;background:#FFD54A;color:#3b116f;font-weight:800;cursor:pointer}
    @media (prefers-color-scheme:light){body{background:#f5f2ff;color:#2c1650}p{color:#64578c}.icon{box-shadow:0 18px 40px #46178f33}}
  </style>
</head>
<body>
  <main>
    <img class="icon" src="/icons/icon-192.png" alt="" />
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحقق من الشبكة ثم أعد المحاولة. سيتم تحميل أحدث البيانات مباشرة عند عودة الاتصال.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
